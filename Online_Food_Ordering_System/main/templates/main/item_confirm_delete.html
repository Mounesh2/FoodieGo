{% extends "main/layout.html" %}

{% block title %}Delete Dish Confirmation — FoodieGo 2.0{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card border-0 shadow-sm rounded-lg p-4 text-center">
                <i class="fa-solid fa-triangle-exclamation text-danger mb-3" style="font-size: 3rem;"></i>
                <h4 class="font-weight-bold text-dark mb-2">Delete Dish?</h4>
                <p class="text-muted mb-4">Are you sure you want to remove <strong>"{{ object.title }}"</strong> from the FoodieGo catalog? This action cannot be undone.</p>
                <form method="POST">
                    {% csrf_token %}
                    <div class="d-flex justify-content-center" style="gap: 1rem;">
                        <a class="btn btn-light rounded-pill px-4" href="{% url 'main:item_list' %}">Cancel</a>
                        <button class="btn btn-danger font-weight-bold rounded-pill px-4" type="submit">Yes, Delete</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
