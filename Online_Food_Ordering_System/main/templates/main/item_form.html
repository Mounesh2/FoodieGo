{% extends "main/layout.html" %}
{% load crispy_forms_tags %}

{% block title %}Manage Dish — FoodieGo 2.0 Admin{% endblock %}

{% block content %}
<div class="container py-4">
    <div class="row justify-content-center">
        <div class="col-lg-8">
            <div class="card border-0 shadow-sm rounded-lg p-4 p-md-5">
                <div class="d-flex justify-content-between align-items-center mb-4 pb-2 border-bottom">
                    <h3 class="font-weight-extrabold text-dark mb-0">Dish Editor</h3>
                    <a href="{% url 'main:item_list' %}" class="btn btn-sm btn-outline-dark rounded-pill px-3">
                        <i class="fa-solid fa-arrow-left mr-1"></i> Back to Catalog
                    </a>
                </div>

                <form method="POST" enctype="multipart/form-data">
                    {% csrf_token %}
                    <fieldset class="form-group mb-4">
                        {{ form|crispy }}
                    </fieldset>
                    <div class="d-flex justify-content-end" style="gap: 0.75rem;">
                        <a href="{% url 'main:item_list' %}" class="btn btn-light rounded-pill px-4">Cancel</a>
                        <button class="btn btn-primary font-weight-bold rounded-pill px-5 shadow-sm" type="submit">
                            Save Dish
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
